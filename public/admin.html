<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TRENO — Administración</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__row">
      <div class="brand"><img src="assets/img/logo-treno.png" alt="TRENO" width="404" height="144"><span>ADMIN</span></div>
      <nav id="tabs" class="tabs" aria-label="Secciones" hidden>
        <button id="tab-orders" class="tab" type="button" aria-pressed="true">Pedidos</button>
        <button id="tab-stock" class="tab" type="button" aria-pressed="false">Productos</button>
      </nav>
      <div class="topbar__end"><button id="logout" class="link" type="button" hidden>Cerrar sesión</button></div>
    </div>
  </header>

  <main class="main">
    <form id="login" class="login" hidden>
      <h1 class="page-title">Iniciar sesión</h1>
      <label class="field">Usuario<input id="username" class="input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field">Contraseña<input id="password" class="input" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="notice" role="alert" hidden></p>
      <button class="btn btn--primary" type="submit">Entrar</button>
    </form>

    <section id="panel" hidden>
      <h1 class="page-title">Pedidos</h1>
      <div id="stats" class="stats" role="group" aria-label="Filtrar por estado"></div>
      <div class="toolbar">
        <label class="visually-hidden" for="order-search">Buscar pedido</label>
        <input id="order-search" class="input" type="search" placeholder="Buscar por nombre, teléfono o número de pedido">
        <span id="count" class="toolbar__count"></span>
      </div>
      <p id="panel-error" class="notice" role="alert" hidden></p>
      <p id="none" class="empty" hidden>No hay pedidos con estos filtros.</p>
      <div id="rows" class="orders"></div>
    </section>

    <section id="stock-panel" hidden>
      <h1 class="page-title">Productos</h1>
      <div class="toolbar">
        <label class="visually-hidden" for="product-search">Buscar producto</label>
        <input id="product-search" class="input" type="search" placeholder="Buscar producto">
        <label class="visually-hidden" for="product-filter">Filtrar productos</label>
        <select id="product-filter" class="select">
          <option value="">Todos</option>
          <option value="low">Stock bajo</option>
          <option value="out">Sin stock (ocultos)</option>
        </select>
        <span id="product-count" class="toolbar__count"></span>
        <button id="new-product" class="btn btn--primary toolbar__end" type="button">+ Nuevo producto</button>
      </div>
      <form id="new-form" class="new-form" hidden>
        <h2 class="panel__title">Nuevo producto</h2>
        <div class="new-form__grid">
          <label class="field new-form__wide">Nombre<input id="new-name" class="input" type="text" maxlength="120" required></label>
          <label class="field">Categoría<select id="new-category" class="select"></select></label>
          <label id="new-category-other" class="field" hidden>Nueva categoría<input id="new-category-name" class="input" type="text" maxlength="40"></label>
          <label class="field">Precio (S/)<input id="new-price" class="input" type="number" min="0.01" max="100000" step="0.01" required></label>
          <label class="field">Stock<input id="new-stock" class="input" type="number" min="0" max="100000" step="1" required></label>
          <label class="field new-form__wide">Descripción (opcional)<textarea id="new-description" class="textarea" rows="3" maxlength="500" placeholder="Medidas, material y uso del producto"></textarea></label>
          <fieldset class="new-form__colors new-form__wide">
            <legend>Colores</legend>
            <div id="new-colors" class="color-choices"></div>
          </fieldset>
        </div>
        <p id="new-error" class="notice" role="alert" hidden></p>
        <div class="new-form__actions">
          <button id="new-submit" class="btn btn--primary" type="submit">Crear producto</button>
          <button id="new-cancel" class="btn" type="button">Cancelar</button>
        </div>
      </form>
      <p id="stock-error" class="notice" role="alert" hidden></p>
      <p id="products-none" class="empty" hidden>No hay productos con estos filtros.</p>
      <div id="stock-rows" class="products"></div>
    </section>
  </main>
  <script src="photos.js"></script>
  <script src="admin.js"></script>
</body>
</html>
